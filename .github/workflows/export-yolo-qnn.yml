name: Export YOLO QNN

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: YOLO weights to export
        required: true
        default: all
        type: choice
        options:
          - all
          - yolo26n
          - yolo26s
      soc:
        description: Qualcomm SoC target
        required: true
        default: SM8750
        type: choice
        options:
          - SM8650
          - SM8750
          - SM8850
      use_fp16:
        description: Export as HTP FP16 instead of quantized HTP
        required: true
        default: true
        type: boolean
      online_prepare:
        description: Compose the QNN graph on device instead of packaging a precompiled context binary
        required: true
        default: true
        type: boolean
      executorch_ref:
        description: ExecuTorch git ref
        required: true
        default: v1.1.0
        type: string
      qnn_sdk_version:
        description: Qualcomm AI Runtime Community SDK version used for lowering
        required: true
        default: 2.37.0.250724
        type: string

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      EXECUTORCH_DIR: ${{ github.workspace }}/.cache/executorch
      EXECUTORCH_BUILD_DIR: ${{ github.workspace }}/.cache/executorch-build-qnn
      QNN_STAGING_DIR: ${{ github.workspace }}/.cache/qnn-staging
      QNN_SDK_ROOT: ${{ github.workspace }}/.cache/qnn-staging/sdk
      EXECUTORCH_REF: ${{ inputs.executorch_ref }}
      EXPORT_DIR: ${{ github.workspace }}/build/qnn_export
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache QNN staging
        uses: actions/cache@v4
        with:
          path: ${{ env.QNN_STAGING_DIR }}
          key: qnn-staging-${{ runner.os }}-${{ inputs.executorch_ref }}-${{ inputs.qnn_sdk_version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ninja-build \
            pkg-config \
            flatbuffers-compiler

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            cmake \
            ninja \
            pydot \
            "ruamel.yaml>=0.18.0" \
            tabulate
          python -m pip install \
            torch==2.10.0 \
            torchvision==0.25.0 \
            torchao==0.15.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "ultralytics>=8.3.0"

      - name: Clone ExecuTorch
        run: |
          rm -rf "$EXECUTORCH_DIR"
          git clone --branch "${{ inputs.executorch_ref }}" --depth 1 https://github.com/pytorch/executorch.git "$EXECUTORCH_DIR"
          git -C "$EXECUTORCH_DIR" submodule update --init --recursive

      - name: Pin QNN SDK version for ExecuTorch download helper
        env:
          QNN_SDK_VERSION: ${{ inputs.qnn_sdk_version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["QNN_SDK_VERSION"].strip()
          path = Path(os.environ["EXECUTORCH_DIR"]) / "backends" / "qualcomm" / "scripts" / "download_qnn_sdk.py"
          source = path.read_text(encoding="utf-8")
          marker = 'QNN_VERSION = "'
          start = source.find(marker)
          if start < 0:
            raise SystemExit(f"Failed to find QNN_VERSION marker in {path}")
          end = source.find('"', start + len(marker))
          if end < 0:
            raise SystemExit(f"Failed to parse QNN_VERSION in {path}")
          patched = source[:start] + f'{marker}{version}"' + source[end + 1:]
          path.write_text(patched, encoding="utf-8")
          print(f"[qnn-export] pinned QNN SDK version to {version}")
          PY

      - name: Install TorchAO from ExecuTorch submodule
        run: |
          pushd "$EXECUTORCH_DIR/third-party/ao" >/dev/null
          export USE_CPP=0
          python -m pip install . --no-build-isolation
          popd >/dev/null

      - name: Build ExecuTorch QNN host adaptor
        run: |
          mkdir -p "$EXPORT_DIR/logs"
          bash "$GITHUB_WORKSPACE/scripts/build_executorch_qnn_host.sh" "$EXECUTORCH_DIR" \
            2>&1 | tee "$EXPORT_DIR/logs/build_executorch_qnn_host.log"

      - name: Export YOLO to QNN
        env:
          PYTHONPATH: ${{ github.workspace }}/.cache
          LD_LIBRARY_PATH: ${{ env.QNN_SDK_ROOT }}/lib/x86_64-linux-clang
        run: |
          mkdir -p "$EXPORT_DIR"
          if [[ "${{ inputs.model_variant }}" == "all" ]]; then
            models=(yolo26n yolo26s)
          else
            models=("${{ inputs.model_variant }}")
          fi

          for model in "${models[@]}"; do
            model_path="$GITHUB_WORKSPACE/scripts/${model}.pt"
            output_name="${model}_qnn"
            args=(
              --weights "$model_path"
              --output-dir "$EXPORT_DIR"
              --output-name "$output_name"
              --soc "${{ inputs.soc }}"
              --qnn-sdk-version "${{ inputs.qnn_sdk_version }}"
              --executorch-ref "${{ inputs.executorch_ref }}"
              --imgsz 416
              --batch 1
            )
            if [[ "${{ inputs.use_fp16 }}" == "true" ]]; then
              args+=(--use-fp16)
            fi
            if [[ "${{ inputs.online_prepare }}" == "true" ]]; then
              args+=(--online-prepare)
            fi
            python "$GITHUB_WORKSPACE/scripts/export_yolo_qnn.py" "${args[@]}" \
              2>&1 | tee "$EXPORT_DIR/logs/export_${model}_qnn.log"
          done

      - name: Upload export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-export-${{ inputs.model_variant }}-${{ inputs.soc }}-${{ inputs.qnn_sdk_version }}-${{ inputs.online_prepare && 'online' || 'offline' }}
          path: ${{ env.EXPORT_DIR }}
