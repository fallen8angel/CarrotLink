org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Stabilize Kotlin compilation on Windows when plugin sources live on a different drive.
# This avoids noisy incremental cache close exceptions that appeared in debug builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Keep Gradle task execution deterministic for plugin compilation/caching.
org.gradle.parallel=false
