# ===== Build stability first (for Windows dev machine responsiveness) =====
# Keep Gradle heap moderate to prevent whole-system stutter during repeated builds.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication

# Reuse daemon, but release it sooner when idle to reduce leftover pressure.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# Limit parallel workers to avoid CPU saturation + UI lag on host machine.
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.priority=low

# Cache and file-system watch improve incremental build time.
org.gradle.caching=true
org.gradle.vfs.watch=true

# Configuration cache is currently disabled for project compatibility.
org.gradle.configuration-cache=false

# Android / Kotlin
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.compiler.execution.strategy=in-process
