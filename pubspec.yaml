name: carrot_pilot_manager
description: A CarrotLink App
publish_to: 'kooingh354'
version: 2.0100.0+2010000

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  connectivity_plus: ^6.0.3
  dartssh2: ^2.5.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  xterm: ^4.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  video_player: ^2.8.1
  chewie: ^1.7.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  share_plus: ^9.0.0
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  http: ^1.2.0
  ssh_key: ^1.0.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  pointycastle: ^3.9.1
  webview_flutter: ^4.13.0
  file_picker: ^8.0.7
  flutter_fancy_tree_view2: ^1.6.3
  re_editor: ^0.8.0
  re_highlight: ^0.0.3
  web_socket_channel: ^2.4.5
  wakelock_plus: ^1.4.0
  msgpack_dart: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter_launcher_icons: ^0.13.1

# CarrotLink keeps a local override because recent-task removal must fully stop
# the foreground background-service notification instead of respawning.
dependency_overrides:
  flutter_background_service_android:
    path: third_party/flutter_background_service_android

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/speed_bg.png
    - assets/models/
    - assets/sidecar/sidecar.py
    - assets/sidecar/sidecar.sh

